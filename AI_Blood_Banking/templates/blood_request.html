<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Blood | AI Blood Bank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🩸 AI Blood Bank
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/register">Become a Donor</a>
            <a href="/request-blood">Request Blood</a>
            <a href="/login">Login</a>
        </div>

    </nav>


    <!-- Blood Request Form -->
    <section class="form-section">

        <div class="form-container">

            <h1>Request Blood</h1>

            <p class="form-subtitle">
                Submit a blood request and find suitable donors quickly.
            </p>


            <form action="/request-blood"
                  method="POST"
                  autocomplete="off">

                <!-- Patient Name -->
                <div class="form-group">

                    <label for="patient_name">
                        Patient Name
                    </label>

                    <input
                        type="text"
                        id="patient_name"
                        name="patient_name"
                        placeholder="Enter patient name"
                        autocomplete="off"
                        required>

                </div>


                <!-- Blood Group -->
                <div class="form-group">

                    <label for="blood_group">
                        Blood Group
                    </label>

                    <select
                        id="blood_group"
                        name="blood_group"
                        required>

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <!-- Units Required -->
                <div class="form-group">

                    <label for="units_required">
                        Units Required
                    </label>

                    <input
                        type="number"
                        id="units_required"
                        name="units_required"
                        min="1"
                        placeholder="Enter number of units"
                        required>

                </div>


                <!-- Hospital Name -->
                <div class="form-group">

                    <label for="hospital_name">
                        Hospital Name
                    </label>

                    <input
                        type="text"
                        id="hospital_name"
                        name="hospital_name"
                        placeholder="Enter hospital name"
                        autocomplete="off"
                        required>

                </div>


                <!-- City -->
                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter city"
                        autocomplete="off"
                        autocapitalize="none"
                        spellcheck="false"
                        required>

                </div>


                <!-- Contact Number -->
                <div class="form-group">

                    <label for="phone">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter contact number"
                        autocomplete="off"
                        required>

                </div>


                <!-- Submit Button -->
                <button
                    type="submit"
                    class="btn primary form-button">

                    Submit Blood Request

                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 AI Blood Banking System | Final Year Project
        </p>

    </footer>

</body>

</html>
