<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Blood Bank</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px 38px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title {
            text-align: center;
            margin: 0;
            color: #222;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #e63946;
        }

        .login-button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 8px;
            background: #e63946;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover {
            background: #d62839;
        }

        .error-message {
            background: #ffe5e5;
            color: #c1121f;
            padding: 11px 13px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #e63946;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 28px 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">🩸</div>

        <h1 class="title">Welcome Back</h1>

        <p class="subtitle">
            Login to AI Blood Banking System
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/login">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Register as Donor</a>
        </div>

    </div>

</div>

</body>
</html>
