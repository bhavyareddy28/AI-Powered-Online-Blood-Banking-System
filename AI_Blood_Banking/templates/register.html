<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Become a Donor | AI Blood Bank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            🩸 AI Blood Bank
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/register">Become a Donor</a>
            <a href="/request-blood">Request Blood</a>
            <a href="#">Login</a>
        </div>

    </nav>


    <!-- Donor Registration Section -->
    <section class="form-section">

        <div class="form-container">

            <h1>Become a Donor</h1>

            <p class="form-subtitle">
                Register as a blood donor and help save lives.
            </p>


            <form method="POST">

                <!-- Name -->
                <div class="form-group">
                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>


                <!-- Age -->
                <div class="form-group">
                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        min="18"
                        placeholder="Enter your age"
                        required>
                </div>


                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <select name="gender" required>

                        <option value="">Select Gender</option>

                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>

                    </select>
                </div>


                <!-- Blood Group -->
                <div class="form-group">
                    <label>Blood Group</label>

                    <select name="blood_group" required>

                        <option value="">Select Blood Group</option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>

                        <option value="B+">B+</option>
                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>
                </div>


                <!-- Phone -->
                <div class="form-group">
                    <label>Phone Number</label>

                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter your phone number"
                        required>
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email address">
                </div>


                <!-- City -->
                <div class="form-group">
                    <label>City</label>

                    <input
                        type="text"
                        name="city"
                        placeholder="Enter your city">
                </div>


                <!-- Donor Availability -->
                <div class="form-group">
                    <label>Donor Availability</label>

                    <select name="available" required>
                        <option value="1">Available</option>
                        <option value="0">Not Available</option>
                    </select>
                </div>


                <!-- Last Donation Date -->
                <div class="form-group">
                    <label>Last Donation Date</label>

                    <input
                        type="date"
                        name="last_donation_date">
                </div>


                <!-- Submit -->
                <button type="submit" class="btn primary form-button">
                    Register as Donor
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 AI Blood Banking System | Final Year Project</p>
    </footer>

</body>

</html>
